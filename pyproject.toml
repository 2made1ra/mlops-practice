[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "mlops_practice"
version = "0.0.1"
description = "MLOps course practice project."
authors = [
  { name = "Andrey Zhunev" },
]
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]
requires-python = "~=3.12.0"
dependencies = [
    "python-dotenv",
]

# Dev tooling is pinned exactly: the same versions must be used by pre-commit hooks.
[dependency-groups]
dev = [
    "mypy==2.4.0",
    "pre-commit==4.7.0",
    "ruff==0.17.2",
]


[tool.ruff]
line-length = 99
target-version = "py312"
src = ["mlops_practice", "scripts"]

[tool.ruff.lint]
# On top of the defaults (E4, E7, E9, F):
extend-select = [
    "E501", # line too long (line-length above); not enforced by default
    "B",    # flake8-bugbear: likely bugs and design problems
    "I",    # isort: import sorting
    "SIM",  # flake8-simplify: simplifications
    "UP",   # pyupgrade: modern syntax for the target Python version
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # re-exports in package __init__ are intentional

[tool.ruff.lint.isort]
known-first-party = ["mlops_practice"]
force-sort-within-sections = true

[tool.mypy]
python_version = "3.12"
files = ["mlops_practice", "scripts"]
strict = true
exclude = [
    '(^|/)__pycache__/',
    '(^|/)\.venv/',
    '(^|/)\.mypy_cache/',
    '(^|/)\.ruff_cache/',
    '(^|/)build/',
    '(^|/)dist/',
]
# Third-party packages without type information must not break the check...
ignore_missing_imports = true

# ...but an unresolved import of our own code is still an error.
[[tool.mypy.overrides]]
module = ["mlops_practice", "mlops_practice.*"]
ignore_missing_imports = false
