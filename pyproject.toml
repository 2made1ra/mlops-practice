[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "mlops_practice"
version = "0.0.1"
description = "MLOps course practice project."
authors = [
  { name = "Andrey Zhunev" },
]
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]
requires-python = "~=3.12.0"
dependencies = [
    "python-dotenv",
]

# Dev tooling is pinned exactly: the same versions must be used by pre-commit hooks.
[dependency-groups]
dev = [
    "mypy==2.4.0",
    "pre-commit==4.7.0",
    "ruff==0.17.2",
]


[tool.ruff]
line-length = 99
src = ["mlops_practice"]
include = ["pyproject.toml", "mlops_practice/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["mlops_practice"]
force-sort-within-sections = true

[tool.mypy]
python_version = "3.12"
files = ["mlops_practice"]
