services:
  s3:
    image: rustfs/rustfs:1.0.4
    ports:
      - "${S3_PORT:-9000}:9000"
      - "${S3_CONSOLE_PORT:-9001}:9001"
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:?set S3_ACCESS_KEY in .env}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:?set S3_SECRET_KEY in .env}
      RUSTFS_CONSOLE_ENABLE: "true"
    volumes:
      - s3-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  create-bucket:
    image: amazon/aws-cli:2.39.3
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
      BUCKET_NAME: ${S3_BUCKET:?set S3_BUCKET in .env}
      ARTIFACT_BUCKET: ${MLFLOW_BUCKET:-mlflow}
      AWS_DEFAULT_REGION: us-east-1
    depends_on:
      s3:
        condition: service_healthy
    entrypoint: ["sh", "-c"]
    command:
      - |
        set -eu
        for bucket in "$$BUCKET_NAME" "$$ARTIFACT_BUCKET"; do
          aws --endpoint-url http://s3:9000 s3api head-bucket --bucket "$$bucket" ||
            aws --endpoint-url http://s3:9000 s3 mb "s3://$$bucket"
        done

  mlflow:
    build: ./docker/mlflow
    depends_on:
      create-bucket:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${MLFLOW_PORT:-5000}:5000"
      - "[::1]:${MLFLOW_PORT:-5000}:5000"
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
      AWS_DEFAULT_REGION: us-east-1
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
      MLFLOW_S3_ENDPOINT_URL: http://s3:9000
      MLFLOW_SERVER_ALLOWED_HOSTS: mlflow:5000,localhost:*,127.0.0.1:*
    command:
      - mlflow
      - server
      - --host=0.0.0.0
      - --port=5000
      - --workers=1
      - --backend-store-uri=sqlite:////store/mlflow.db
      - --serve-artifacts
      - --artifacts-destination=s3://${MLFLOW_BUCKET:-mlflow}/
    volumes:
      - mlflow-db:/store
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://localhost:5000/health', timeout=3).read()"]
      interval: 5s
      timeout: 4s
      retries: 24
      start_period: 20s

  train:
    build:
      context: .
      args:
        GIT_COMMIT: ${GIT_COMMIT:-}
    profiles: ["training"]
    depends_on:
      mlflow:
        condition: service_healthy
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET}
      S3_ENDPOINT_URL: http://s3:9000
      MLFLOW_TRACKING_URI: http://mlflow:5000
      DATA_CACHE_DIR: /cache/datasets
    volumes:
      - dataset-cache:/cache/datasets

volumes:
  s3-data:
  mlflow-db:
  dataset-cache:
