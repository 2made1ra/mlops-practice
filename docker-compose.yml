services:
  s3:
    image: rustfs/rustfs:1.0.4
    ports:
      - "${S3_PORT:-9000}:9000"
      - "${S3_CONSOLE_PORT:-9001}:9001"
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:?set S3_ACCESS_KEY in .env}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:?set S3_SECRET_KEY in .env}
      RUSTFS_CONSOLE_ENABLE: "true"
    volumes:
      - s3-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  create-bucket:
    image: amazon/aws-cli:2.39.3
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
      AWS_DEFAULT_REGION: us-east-1
    depends_on:
      s3:
        condition: service_healthy
    entrypoint: ["sh", "-c"]
    command:
    - >-
      aws --endpoint-url http://s3:9000 s3api head-bucket --bucket ${S3_BUCKET}
      || aws --endpoint-url http://s3:9000 s3 mb s3://${S3_BUCKET}

volumes:
  s3-data:
