# Hook versions must match the dev dependency group in pyproject.toml.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.2
    hooks:
      - id: ruff-check
      - id: ruff-format
        args: [--check]

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.4.0
    hooks:
      - id: mypy
        # Drop the hook's default --ignore-missing-imports: pyproject.toml relaxes it for
        # third-party packages only. Check the whole project, like `make check` does.
        args: []
        pass_filenames: false
        additional_dependencies:
          - python-dotenv

  - repo: https://github.com/kynan/nbstripout
    rev: 0.9.1
    hooks:
      - id: nbstripout
